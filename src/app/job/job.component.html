<mat-card appearance="outlined">
	<mat-card-header>
		<mat-card-title>{{job.title}}</mat-card-title>
		<mat-card-subtitle>at {{job.company}}</mat-card-subtitle>
	</mat-card-header>
	<mat-card-content>
		<mat-list>
			<!-- Simple strings can use object identity for tracking -->
			<!-- eslint-disable-next-line @angular-eslint/template/use-track-by-function -->
			@for (accomplishment of job.accomplishments; track accomplishment) {
				<mat-list-item>{{accomplishment}}</mat-list-item>
			}
		</mat-list>
	</mat-card-content>
	<mat-card-footer>
		<p>
			From <time [attr.datetime]="job.start.toISOString()">{{job.start | date}}</time>&nbsp;
			@if (job.end) {
				to <time [attr.datetime]="job.end?.toISOString()">{{job.end | date}}</time>.
			} @else {
				and currently still working here.
			}
		</p>
</mat-card-footer>
</mat-card>
